<!doctype html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><style>body{background:#07111f;color:white;font:16px Arial;max-width:1000px;margin:auto;padding:16px}h1,h2{color:#65e6c4}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.card{background:#17283d;padding:14px;border-radius:12px;overflow-wrap:anywhere}input,select,button{box-sizing:border-box;width:100%;padding:10px;margin:5px 0;border-radius:8px}input,select{background:#07111f;color:white;border:1px solid #34465d}button{background:#65e6c4;border:0;font-weight:bold}.danger{background:#ff7777}.photo{width:80px;height:80px;object-fit:cover;border-radius:50%}#status{color:#65e6c4}</style><h1>Admin Dashboard 🛡️</h1><p id="who"></p><button id="logout">Logout</button><h2>Student Profiles — edit or delete</h2><p id="status"></p><div id="list" class="grid"></div><h2>Add another Admin</h2><p>Firebase Console → Authentication → Users থেকে সেই ব্যক্তির UID কপি করো। Firestore-এ <code>admins</code> collection-এর document ID হিসেবে UID দিয়ে <code>role</code> string field <code>admin</code> তৈরি করো। কেবল বিশ্বস্ত ব্যক্তিকে Admin করো।</p><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";import{getFirestore,doc,getDoc,collection,onSnapshot,updateDoc,deleteDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";const firebaseConfig={apiKey:"AIzaSyDGeMNpKYyDYWSgOtWY42MUWVQmmOrv7ug",authDomain:"dcms-23-community.firebaseapp.com",projectId:"dcms-23-community",storageBucket:"dcms-23-community.firebasestorage.app",messagingSenderId:"71029823331",appId:"1:71029823331:web:e58307a6f01aa5bb126556"};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=x=>document.getElementById(x);let stop;function el(p,t,v){let e=document.createElement(t);e.textContent=v??"";p.append(e);return e}onAuthStateChanged(auth,async u=>{if(!u){location.replace("index.html");return}let a=await getDoc(doc(db,"admins",u.uid));if(!a.exists()){location.replace("dashboard.html");return} $("who").textContent="Admin: "+u.email;stop=onSnapshot(collection(db,"students"),s=>render(s.docs.map(d=>({id:d.id,...d.data()}))),e=>$("status").textContent=e.message)});function render(list){let b=$("list");b.replaceChildren();list.forEach(s=>{let c=document.createElement("article");c.className="card";if(s.photo){let im=el(c,"img","");im.src=s.photo;im.className="photo"}let n=el(c,"input");n.value=s.name||"";let r=el(c,"input");r.value=s.roll||"";let d=el(c,"select");["Science","Business Studies","Humanities"].forEach(v=>{let o=el(d,"option",v);o.value=v});d.value=s.department||"Science";let bd=el(c,"input");bd.type="date";bd.value=s.birthday||"";let fb=el(c,"input");fb.type="url";fb.value=s.facebook||"";let label=el(c,"label","Birthday list-এ দেখাবে ");let cb=document.createElement("input");cb.type="checkbox";cb.checked=!!s.showBirthday;label.append(cb);let save=el(c,"button","Save changes");save.onclick=async()=>{try{await updateDoc(doc(db,"students",s.id),{name:n.value.trim(),roll:r.value.trim(),department:d.value,birthday:bd.value,facebook:fb.value.trim(),showBirthday:cb.checked,updatedAt:serverTimestamp()});$("status").textContent="Updated: "+n.value}catch(e){alert(e.message)}};let del=el(c,"button","Delete profile");del.className="danger";del.onclick=async()=>{if(confirm("প্রোফাইল মুছবে?"))try{await deleteDoc(doc(db,"students",s.id))}catch(e){alert(e.message)}};b.append(c)})}$("logout").onclick=async()=>{if(stop)stop();await signOut(auth);location.replace("index.html")};</script></html>
